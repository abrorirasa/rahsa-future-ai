name: Paper Trading Otomatis

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan paper trading
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: python3 paper_trading_v3.py

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hasil_simulasi_v3.txt
          git commit -m "Update hasil paper trading otomatis" || echo "Tidak ada perubahan"
          git push
